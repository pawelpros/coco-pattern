enabled: true

ccManager:
  enabled: true
  defaultMode: "on"

operator:
  # Leave empty so GPU operator infrastructure pods use the cluster default runtime (crun).
  # The CRI-O `nvidia` handler is not configured on this bare-metal CoCo node.
  # CoCo GPU workloads use runtimeClassName: kata-cc-nvidia-gpu (set per-workload).
  runtimeClass: ""

kataSandboxDevicePlugin:
  enabled: true

iommu:
  enabled: true
